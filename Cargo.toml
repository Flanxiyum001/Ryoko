[workspace]
resolver = "2"
members = [
    "crates/ryoko-core",
    "crates/ryoko-models",
    "crates/ryoko-native",
    "crates/ryoko-sandbox",
    "crates/ryoko-scripting",
    "crates/ryoko-vfs",
    "crates/ryoko-worktree",
    "crates/ryoko-cli",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/Flanxiyum001/Ryoko"
authors = ["Project Ryoko contributors"]

[workspace.dependencies]
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
ignore = "0.4"
mlua = { version = "0.10", features = ["luau", "vendored", "serialize", "send"] }
notify = "6.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
wasmtime = { version = "26.0", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
