[package]
name = "ryoko-desktop"
version = "0.1.0"
description = "Native desktop shell for the Ryoko multi-agent engineering workbench"
authors = ["Project Ryoko contributors"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Flanxiyum001/Ryoko"

[lib]
name = "ryoko_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
