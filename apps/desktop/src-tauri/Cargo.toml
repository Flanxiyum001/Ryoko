[package]
name = "ryoko-desktop"
version = "0.1.0"
description = "Native desktop shell for the Ryoko multi-agent engineering workbench"
authors = ["Project Ryoko contributors"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Flanxiyum001/Ryoko"

[lib]
name = "ryoko_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures = "0.3"
ignore = "0.4"
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
regex = "1"
ryoko-core = { path = "../../../crates/ryoko-core" }
ryoko-models = { path = "../../../crates/ryoko-models" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

# The Linux folder picker is a GTK dialog made transient for the main window;
# gtk is already part of the Tauri dependency tree on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[features]
custom-protocol = ["tauri/custom-protocol"]
