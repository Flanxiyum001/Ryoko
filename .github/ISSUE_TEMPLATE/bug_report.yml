name: "Bug report"
description: "Report a reproducible defect in Ryoko (not a security vulnerability)."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Ryoko. Ryoko is pre-alpha, so check existing issues and the latest release first.
        **Security vulnerabilities must not be reported here.** Follow [SECURITY.md](https://github.com/Flanxiyum001/Ryoko/blob/main/SECURITY.md) for private reporting. Do not include secrets, private code, or sensitive logs.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Select the area most closely related to the issue.
      options:
        - "Desktop editor / Tauri UI"
        - "CLI / command-line workflows"
        - "Agent orchestration / Mission Control"
        - "AI models / provider adapters"
        - "Sandbox / validation / worktrees"
        - "GitHub App / integration"
        - "Installer / packaging / platform"
        - "Documentation"
        - "Other / unsure"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ryoko version / commit
      description: Include the release tag or commit SHA, if known.
      placeholder: "e.g. preview release tag or git commit SHA"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and environment
      placeholder: "e.g. Windows 11 x64, Rust 1.85, local model provider"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the unexpected behaviour and its impact.
      placeholder: "A clear and concise explanation of the problem."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe reproduction possible.
      placeholder: |
        1. Open ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or additional context
      description: Optional; redact tokens, paths containing personal information, private prompts, and other sensitive information. Do not post exploit details.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: "I searched existing issues and checked that this is not a duplicate."
          required: true
        - label: "This report contains no secrets or private data, and it is not a security vulnerability."
          required: true
        - label: "I agree to follow the project's Code of Conduct."
          required: true
