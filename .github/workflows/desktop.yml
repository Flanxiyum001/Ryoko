name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux (AppImage, deb)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: macOS (dmg)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: Windows (msi, nsis)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm libssl-dev build-essential curl wget file

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Build ryoko-lsp sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p ryoko-native --bin ryoko-lsp --target "${{ matrix.target }}"
          mkdir -p apps/desktop/src-tauri/binaries
          BIN="target/${{ matrix.target }}/release/ryoko-lsp"
          if [ ! -f "$BIN" ]; then BIN="$BIN.exe"; fi
          DEST="apps/desktop/src-tauri/binaries/ryoko-lsp-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then DEST="$DEST.exe"; fi
          cp "$BIN" "$DEST"

      - name: Build native installers
        working-directory: apps/desktop
        run: npm run tauri build -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ryoko-desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
